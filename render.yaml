# Optimized for Render's $0 / no-credit-card free tier.
#
# IMPORTANT MATH: Render's free tier grants 750 pooled instance-hours per
# *workspace* per month, not 750 hours per service. One always-on free
# service uses ~730 hours/month (nearly the whole pool). Two always-on
# free services use ~1,460 hours/month combined - that exceeds the pool
# in about two weeks, after which ALL your free services get suspended
# for the rest of the month. This is why this file defines exactly two
# always-on services (not the original four): that's the most platform
# coverage that reliably fits inside the 750-hour pool with headroom.
#
# Services removed vs. the original render.yaml:
#   - viewer-counter-youtube-chat: dead code. server.js/services/chat/
#     youtubeChat.js already gets YouTube chat via youtubei.js directly
#     in Node - nothing in this repo ever called this service's URL.
#     Deleting it costs zero functionality and saves ~730 hrs/month.
#   - viewer-counter-nimo: merged into viewer-counter-tiktok below
#     (renamed viewer-counter-sidecar) - see /platform-sidecar.
#
# The static frontend (public/) is no longer deployed as part of this
# file - deploy it to Cloudflare Pages instead (free, not part of
# Render's instance-hour pool at all). See the Cloudflare Pages section
# in the writeup for exact steps. The Node service below still serves
# public/ too, so nothing breaks if you skip Cloudflare Pages.

services:
  # Main overlay web service (Node/Express + Socket.IO).
  # Must stay always-on: it holds the live WebSocket connections that
  # power the /chat overlay, and serves /api/viewers on every OBS poll.
  - type: web
    name: viewer-counter
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: TWITCH_USERNAME
        sync: false
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      - key: KICK_USERNAME
        sync: false
      - key: RUMBLE_API_URL
        sync: false
      - key: RUMBLE_API_KEY
        sync: false
      - key: RUMBLE_CHANNEL
        sync: false
      - key: PLATFORM_SIDECAR_URL
        sync: false
      - key: TIKTOK_USERNAME
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        sync: false
      - key: KICK_CHATROOM_ID
        sync: false
      - key: KICK_PUSHER_APP_KEY
        sync: false
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_SESSION
        sync: false
      - key: INSTAGRAM_LIVE_COMMENTS_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PORT
        value: 3000

  # Combined TikTok + Nimo sidecar (Python, TikTokLive.py + Playwright +
  # Flask). Handles TikTok viewer counts + chat AND Nimo chat in one
  # process - see /platform-sidecar/app.py for why combining these two
  # (and only these two) is safe. Must stay always-on: both platforms
  # need a persistent connection (TikTok websocket / Nimo browser
  # session) that can't be recreated on-demand per request without
  # losing chat continuity.
  #
  # Deployed via Docker (platform-sidecar/Dockerfile), not Render's
  # native Python builder. The native builder's `playwright install
  # chromium` step downloads the browser into a build-time cache
  # directory that Render does not guarantee is present at runtime,
  # producing "BrowserType.launch: Executable doesn't exist at
  # /opt/render/.cache/ms-playwright/...". Docker sidesteps this
  # entirely: Chromium is baked into the image itself, so there's no
  # separate runtime filesystem for it to go missing from.
  #
  # Deploy this, then copy its public Render URL into the main service's
  # PLATFORM_SIDECAR_URL env var above.
  - type: web
    name: viewer-counter-sidecar
    runtime: docker
    plan: free
    dockerfilePath: ./platform-sidecar/Dockerfile
    dockerContext: .
    envVars:
      - key: TIKTOK_USERNAME
        sync: false
      - key: NIMO_URL
        sync: false
      - key: PORT
        value: 5005
