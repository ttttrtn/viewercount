<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Multi-Platform Chat Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="chat-feed" class="chat-feed"></div>

  <!-- Socket.IO client, served automatically by the socket.io server.
       Loaded from the backend's own origin (via config.js) since this
       page may be hosted cross-origin on Cloudflare Pages. -->
  <script src="../config.js"></script>
  <script>
    document.write(
      '<script src="' + (window.VIEWER_COUNTER_API_BASE || '') + '/socket.io/socket.io.js"><\/script>'
    );
  </script>
  <script src="badges.js"></script>
  <script src="script.js"></script>
</body>
</html>
